spring.application.name=nidio-backend

# Server
server.port=8080

# Datasource (PostGIS/PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nidio}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ml-service (valuación y Life Score)
app.ml-service.base-url=${ML_SERVICE_URL:http://localhost:8000}

# JWT
app.jwt.secret=${JWT_SECRET:change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail (HU-03: recuperación de contraseña)
spring.mail.host=${MAIL_HOST:smtp.example.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_FROM:no-reply@nidio.com}
app.mail.password-reset-url-base=${PASSWORD_RESET_URL_BASE:http://localhost:5173/reset-password}
