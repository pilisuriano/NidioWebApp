spring.application.name=nidio-backend

# Server
server.port=8080

# Datasource (PostGIS/PostgreSQL)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/nidio}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# ml-service (valuación y Life Score)
app.ml-service.base-url=${ML_SERVICE_URL:http://localhost:8000}

# Georef (API pública de datos.gob.ar): validación de direcciones al publicar
# (HU "Publicar" — autocomplete + chequeo de que la dirección esté realmente
# dentro del barrio elegido). No es scraping: es la API oficial de datos
# abiertos del Estado argentino, de uso público y gratuito.
app.georef.base-url=${GEOREF_BASE_URL:https://apis.datos.gob.ar/georef/api}

# JWT
app.jwt.secret=${JWT_SECRET:change-me}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Mail (HU-03: recuperación de contraseña; verificación de email al registrarse).
# Gmail SMTP con la cuenta nidio.propiedades@gmail.com: hace falta verificación
# en dos pasos + una "contraseña de aplicación" (no la contraseña normal de
# la cuenta) en MAIL_PASSWORD, ver backend/.env.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:nidio.propiedades@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
app.mail.from=${MAIL_FROM:nidio.propiedades@gmail.com}
app.mail.password-reset-url-base=${PASSWORD_RESET_URL_BASE:http://localhost:5173/auth/restablecer}
app.mail.verification-url-base=${EMAIL_VERIFICATION_URL_BASE:http://localhost:5173/auth/verificar}

# Fotos subidas desde "Publicar" (HU nueva): van a Cloudinary (plan gratuito)
# en vez de disco local, porque Render no tiene disco persistente entre
# deploys. Credenciales en backend/.env (ver CLOUDINARY_* ahí).
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
app.cloudinary.api-key=${CLOUDINARY_API_KEY:}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET:}
